- style: 'block {}'
  rules:
    - selector:
        - tag: block
          specificity: 1
      declarations: []

- style: 'block inline {}'
  rules:
    - selector:
        - tag: block
          specificity: 1
        - tag: inline
          specificity: 1
      declarations: []

#3
- style: '#content block.selected {}'
  rules:
    - selector:
        - id: content
          specificity: 65536
        - tag: block
          class:
            - selected
          specificity: 257
      declarations: []

#4
- style: '#id {}'
  rules:
    - selector:
        - id: id
          specificity: 65536
      declarations: []

#5
- style: 'block > * {}'
  rules:
    - selector:
        - tag: block
          specificity: 1
          combinator: 1
        - asterisk: true
      declarations: []
