- html: |
    <block id="t">
      <space></space>
    </block>
  calc:
    t: [0,0,1024,768]

- html: |
    <block>
      <inline id="t"></inline>
      <space></space>
    </block>
  calc:
    t: [0,0,0,0]

- html: |
    <block>
      <inline id="t">
        <img id=img width=100 height=50>
      </inline>
      <space></space>
    </block>
  calc:
    img: [0,0,100,50]
    t: [0,0,100,50]

- html: |
    <block>
      <inline id="t" width=50%></inline>
    </block>
  calc:
    t: [0,0,512,0]

- html: |
    <block>
      <inline width="100%" id=i>
        <block width="25%" id=b1></block>
        <block width="25%" id=b2></block>
        <block width="25%" id=b3></block>
      </inline>
    </block>
  calc:
    i: [0,0,1024,0]
    b1: [0,0,256,0]
    b2: [256,0,256,0]
    b3: [512,0,256,0]

- html: |
    <block>
      <inline></inline>
      <space height=50></space>
      <block height=50></block>
      <space id=s></space>
      <inline></inline>
    </block>
  calc:
    s: [0,100,0,668]

- html: |
    <block>
      <inline>
        <inline height=100 id=i align=middle>
          <img id=img>
        </inline>
      </inline>
    </block>
  calc:
    i: [0,0,0,100]
    img: [0,50,0,0]

#7
- html: |
    <block>
      <inline id=i></inline>
    </block>
  style: |
    block {
      color: red;
    }
  computed:
    i:
      Color:
        type: 2
        color: 4281490431 # 0xFF325BFF

#8 非Spacer作为Spacer自动布局。
- html: |
    <block>
      <block id=a spacer></block>
      <block height=68></block>
    </block>
  calc:
    a: [0,0,1024,700]
  computed:
    a:
      Spacer:
        type: 5
        bool: true

#9
- html: |
    <block>
      <inline>
        <inline id=status-bar>
          <img id=img>
        </inline>
      </inline>
    </block>
  style: |
    #status-bar { color: green; }
  computed:
    status-bar:
      Color:
        type: 2
        color: 396892159
    img:
      Color:
        type: 2
        color: 396892159

#10 有默认值的情况下，如果父元素设置了，仍然应该从（最近有设置的）父元素继承
- html: |
    <block>
      <block id=status-bar>
        <img id=img>
      </block>
    </block>
  enable_default_styles: true
  style: |
    #status-bar { color: green; }
  computed:
    img:
      Color:
        type: 2
        color: 396892159

#11 后代选择器继承
- html: |
    <block>
      <block id=b1>
        <inline id=i1></inline>
      </block>
      <block id=b2>
        <inline id=i2></inline>
      </block>
    </block>
  style: |
    block { font-size: 10; }
    #b1 inline { font-size: 18; }
  computed:
    b1:
      FontSize:
        type: 3
        number: 10
    b2:
      FontSize:
        type: 3
        number: 10
    i1:
      FontSize:
        type: 3
        number: 18
    i2:
      FontSize:
        type: 3
        number: 10
