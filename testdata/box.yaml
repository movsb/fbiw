#8 非Spacer作为Spacer自动布局。
- html: |
    <block>
      <block id=a spacer></block>
      <block height=68></block>
    </block>
  calc:
    a: [0,0,1024,700]
  computed:
    a:
      Spacer:
        type: 5
        bool: true

#9
- html: |
    <block>
      <inline>
        <inline id=status-bar>
          <img id=img>
        </inline>
      </inline>
    </block>
  style: |
    #status-bar { color: green; }
  computed:
    status-bar:
      Color:
        type: 2
        color: 4279740439
    img:
      Color:
        type: 2
        color: 4279740439

#10 有默认值的情况下，如果父元素设置了，仍然应该从（最近有设置的）父元素继承
- html: |
    <block>
      <block id=status-bar>
        <img id=img>
      </block>
    </block>
  enable_default_styles: true
  style: |
    #status-bar { color: green; }
  computed:
    img:
      Color:
        type: 2
        color: 4279740439

#11 后代选择器继承
- html: |
    <block>
      <block id=b1>
        <inline id=i1></inline>
      </block>
      <block id=b2>
        <inline id=i2></inline>
      </block>
    </block>
  style: |
    block { font-size: 10; }
    #b1 inline { font-size: 18; }
  computed:
    b1:
      FontSize:
        type: 3
        number: 10
    b2:
      FontSize:
        type: 3
        number: 10
    i1:
      FontSize:
        type: 3
        number: 18
    i2:
      FontSize:
        type: 3
        number: 10

