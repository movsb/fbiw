<document>

	color: white;
}

#page {
	background-color: #17191f;
	align: both;
}

button {

	height: 64;
}

button.selected {
	outline-width: 3;
	outline-color: white;
}

}

		<spacer height="24"></spacer>
		<text id="status">等待操作</text>
		<spacer height="10"></spacer>

	</block>

</document>
