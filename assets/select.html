<document>
<style>

	color: white;
}

	background-color: #000000A8;
}

#popup {
	width: 560;
	padding: 24;
	background-color: #202124;
	border-width: 2;
	border-color: #5f6368;
}

	width: 508;
}

	background-color: #2b2d31;
}

}

#empty {
	width: 508;
	height: 72;
	align: both;
	color: #aeb4c0;

<stack fill>
	<block id="backdrop"></block>
	<inline align="both">

			<scroll id="list" max-rows="7" row-height="56" gap="4"></scroll>
			<block id="empty"><text>暂无选项</text></block>
		</block>
	</inline>
